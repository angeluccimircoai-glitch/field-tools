<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>現場技術ツール 試作 v0.3</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#152438;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#173b60;color:white;padding:22px 18px}main{max-width:660px;margin:auto;padding:16px}h1{font-size:21px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}.sub{font-size:12px;opacity:.8}.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #15243812}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.tabs button.active{background:#173b60;color:white}button,select,input{font:inherit;border:1px solid #c6d0dd;border-radius:9px;padding:11px;background:white;min-height:44px}label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}select,input{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#f3f6fa;border-radius:9px;padding:12px}.item small{display:block;color:#536579;margin-bottom:5px}.item strong{font-size:17px}.warn{background:#fff4dc;border:1px solid #e6bf65;color:#684913;border-radius:10px;padding:12px;font-size:13px;line-height:1.55}.muted{color:#627184;font-size:13px;line-height:1.6}.hidden{display:none}.pill{display:inline-block;border-radius:999px;background:#e4edf7;color:#204a73;padding:4px 9px;font-size:12px}a{color:#135ba3;overflow-wrap:anywhere}footer{padding:14px;text-align:center;color:#68788a;font-size:12px}</style><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#173b60"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="./icon-192.png"></head><body><header><h1>🔧 現場技術ツール</h1><div class="sub">フランジ規格検索・オフライン試作品 v0.3</div></header><main><div id="offlineStatus" class="muted" style="margin-bottom:10px" role="status">オフライン利用の準備状態を確認中</div><div class="card"><h2>登録データの状況</h2><p class="muted" id="catalogStatus">規格データを確認中</p></div><div class="card"><h2>検索条件</h2><div class="tabs"><button id="tabSelect" class="active">選択式</button><button id="tabText">文字入力式</button></div><div id="selectMode"><label>規格</label><select id="std"><option>JPI</option><option>JIS</option></select><label>圧力クラス</label><select id="pressure"><option>300LB</option><option>150LB</option><option>600LB</option></select><label>呼び径</label><select id="size"><option value="100A">100A（4B）</option><option value="50A">50A（2B）</option><option value="80A">80A（3B）</option><option value="150A">150A（6B）</option><option value="200A">200A（8B）</option></select><label>フランジ形式</label><select id="flange"><option value="UNSPECIFIED">形式未指定（参考データ）</option><option>WN</option><option>SO</option><option>BL</option><option>SW</option><option>TH</option><option>LJ</option></select><label>座面</label><select id="facing"><option>RF</option><option>FF</option><option>RTJ</option></select></div><div id="textMode" class="hidden"><label>キーワード検索</label><input id="query" placeholder="例：JPI 300LB 100A RF"><p class="muted">4B、4インチ、100Aの表記に対応。規格・圧力・呼び径の組み合わせを照合します。</p></div><button id="search" style="width:100%;background:#173b60;color:white;margin-top:14px">検索</button></div><div id="results" aria-live="polite"></div></main><footer>試作品：設計・学習用。施工・製作・発注判断に使用しないでください。</footer><script src="./catalog.js"></script><script>
'use strict';const $=id=>document.getElementById(id);let mode='select';const records=window.FIELD_FLANGE_DATA.records;const data=records[0];function toggle(which){mode=which;$('selectMode').classList.toggle('hidden',which!=='select');$('textMode').classList.toggle('hidden',which!=='text');$('tabSelect').classList.toggle('active',which==='select');$('tabText').classList.toggle('active',which==='text')} $('catalogStatus').textContent=`登録条件：${records.length}件 ／ 確認状態：未検証 ／ JPI・JISの全形式は未収録。検索条件に存在してもデータ未登録の場合があります。`; $('tabSelect').onclick=()=>toggle('select');$('tabText').onclick=()=>toggle('text');$('std').onchange=()=>{$('pressure').innerHTML=($('std').value==='JPI'?['300LB','150LB','600LB']:['10K','5K','20K']).map(x=>`<option>${x}</option>`).join('')};function item(k,v){return `<div class="item"><small>${k}</small><strong>${v}</strong></div>`}function search(){let ok=false;if(mode==='select'){ok=$('std').value===data.std&&$('pressure').value===data.pressure&&$('size').value===data.size&&$('facing').value===data.facing&&$('flange').value==='UNSPECIFIED'}else{let q=$('query').value.toUpperCase().replace(/[（）()]/g,' ').replace(/\s+/g,' ').trim();ok=/JPI/.test(q)&&/(300\s*(LB|#|CLASS)?)/.test(q)&&/(100\s*A|4\s*B|4\s*インチ|4\s*INCH)/.test(q)&&!/(150\s*LB|600\s*LB|\bWN\b|\bSO\b|\bBL\b|\bSW\b|\bTH\b|\bLJ\b|\bFF\b|\bRTJ\b)/.test(q)}if(!ok){$('results').innerHTML='<div class="card"><h2>該当する登録データがありません</h2><p class="muted">現在の試作品には「JPI 300LB 100A（4B） RF・形式未指定」の調査候補データのみ登録しています。形式別の寸法や他の規格は未登録です。規格値が存在しないことを意味しません。</p></div>';return}$('results').innerHTML=`<div class="warn"><b>⚠️ 未検証の調査候補値</b><br>正式規格本文との照合・形式別適合確認は未完了です。現場での製作・発注・強度判断には使用しないでください。</div><div class="card"><span class="pill">JPI 300LB 100A（4B） RF</span><h2 style="margin-top:12px">フランジ寸法</h2><p class="muted">形式：未指定（WN/SO/BL等への適用未確定）</p><div class="grid">${item('外径',data.d+' mm')}${item('厚さ（参考）',data.t+' mm')}${item('PCD',data.pcd+' mm')}${item('ボルト穴径',data.holeD+' mm')}${item('穴数',data.holes+' 穴')}${item('RF座面径',data.faceD+' mm')}</div></div><div class="card"><h2>ボルト・ナット</h2><label>ボルト形式（数量モデル）</label><select id="boltType"><option value="stud">スタッドボルト</option><option value="hex">六角ボルト</option></select><div class="grid" style="margin-top:12px">${item('ねじ候補（メートル）',data.threadMetric)}${item('ねじ候補（インチ）',data.threadInch)}${item('ボルト本数',data.holes+' 本')}<div class="item"><small>ナット数（基本構成）</small><strong id="nutCount">16 個</strong></div>${item('スパナサイズ','未確認')}${item('ボルト長さ','未確認')}</div><p class="muted">ねじ候補は代替表記であり、互換性を保証しません。実際の締結仕様・ナット規格を確認してください。</p></div><div class="card"><h2>うず巻形ガスケット（内外輪付）</h2><p class="muted">JPI-7S-41-2018対応の公開メーカー資料に基づく候補。フランジとの適合は未確認。</p><div class="grid">${item('内輪内径 D1',data.gasket[0]+' mm')}${item('本体内径 D2',data.gasket[1]+' mm')}${item('本体外径 D3',data.gasket[2]+' mm')}${item('外輪外径 D4',data.gasket[3]+' mm')}</div></div><div class="card"><h2>出典・確認状況</h2><p class="muted">フランジ：JPI-7S-15（2011参照の公開表）<br><a href="https://www.ryutai.co.jp/shiryou/flange/jpi/jpi-flange-2011.htm">流体工業 寸法表</a><br>ねじ候補：<a href="https://www.daiko-jp.com/media/useful/a353">ダイコー公開資料</a><br>ガスケット：<a href="https://www.nichias.co.jp/cms/nichias/pdf/catalog/E04.pdf">ニチアス E04 カタログ</a><br>検証状態：未承認・規格本文未照合</p></div>`;$('boltType').onchange=e=>$('nutCount').textContent=e.target.value==='stud'?'16 個':'8 個'}$('search').onclick=()=>{search();$('results').scrollIntoView({behavior:'smooth',block:'start'})};search();</script><script>
(function(){const s=document.getElementById('offlineStatus');if(!('serviceWorker' in navigator)){s.textContent='この環境ではオフライン保存機能を利用できません';return}if(location.protocol==='file:'){s.textContent='単体HTMLは閲覧可能。完全オフラインPWAの登録にはHTTPS公開が必要です';return}navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{s.textContent='オフライン保存の準備が完了しました（初回はオンラインで全ファイル取得が必要）'}).catch(()=>{s.textContent='オフライン保存を設定できませんでした'});})();
</script></body></html>
