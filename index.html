<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>現場技術ツール 試作 v0.6</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#152438;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#173b60;color:white;padding:22px 18px}main{max-width:660px;margin:auto;padding:16px}h1{font-size:21px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}.sub{font-size:12px;opacity:.8}.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #15243812}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.tabs button.active{background:#173b60;color:white}button,select,input{font:inherit;border:1px solid #c6d0dd;border-radius:9px;padding:11px;background:white;min-height:44px}label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}select,input{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#f3f6fa;border-radius:9px;padding:12px}.item small{display:block;color:#536579;margin-bottom:5px}.item strong{font-size:17px}.warn{background:#fff4dc;border:1px solid #e6bf65;color:#684913;border-radius:10px;padding:12px;font-size:13px;line-height:1.55}.muted{color:#627184;font-size:13px;line-height:1.6}.hidden{display:none}.pill{display:inline-block;border-radius:999px;background:#e4edf7;color:#204a73;padding:4px 9px;font-size:12px}a{color:#135ba3;overflow-wrap:anywhere}footer{padding:14px;text-align:center;color:#68788a;font-size:12px}</style><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#173b60"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="./icon-192.png"></head><body><header><h1>🔧 現場技術ツール</h1><div class="sub">フランジ規格検索・オフライン試作品 v0.6</div></header><main><div id="offlineStatus" class="muted" style="margin-bottom:10px" role="status">オフライン利用の準備状態を確認中</div><div class="card"><h2>登録データの状況</h2><p class="muted" id="catalogStatus">規格データを確認中</p><details><summary style="cursor:pointer;padding:8px 0">登録済み条件と検証状態を表示</summary><div id="recordList" class="muted"></div></details></div><div class="card"><h2>検索条件</h2><div class="tabs"><button id="tabSelect" class="active">選択式</button><button id="tabText">文字入力式</button></div><div id="selectMode"><label>規格</label><select id="std"><option>JPI</option><option>JIS</option></select><label>圧力クラス</label><select id="pressure"><option>300LB</option><option>150LB</option><option>600LB</option></select><label>呼び径</label><select id="size"><option value="100A">100A（4B）</option><option value="50A">50A（2B）</option><option value="80A">80A（3B）</option><option value="150A">150A（6B）</option><option value="200A">200A（8B）</option></select><label>フランジ形式</label><select id="flange"><option value="UNSPECIFIED">形式未指定（参考データ）</option><option>WN</option><option>SO</option><option>BL</option><option>SW</option><option>TH</option><option>LJ</option></select><label>座面</label><select id="facing"><option>RF</option><option>FF</option><option>RTJ</option></select></div><div id="textMode" class="hidden"><label>キーワード検索</label><input id="query" placeholder="例：JPI 300LB 100A RF"><p class="muted">4B、4インチ、100Aの表記に対応。規格・圧力・呼び径の組み合わせを照合します。</p></div><button id="search" style="width:100%;background:#173b60;color:white;margin-top:14px">検索</button></div><div id="results" aria-live="polite"></div></main><footer>試作品：設計・学習用。施工・製作・発注判断に使用しないでください。</footer><script src="./catalog.js"></script><script>
'use strict';const $=id=>document.getElementById(id);let mode='select';const records=window.FIELD_FLANGE_DATA.records;let data=null;const validRecords=records.filter(r=>r&&['JPI','JIS'].includes(r.std)&&typeof r.pressure==='string'&&typeof r.size==='string'&&typeof r.facing==='string'&&typeof r.flange==='string'&&Number.isInteger(r.holes)&&r.holes>0&&['UNVERIFIED','SOURCE_CHECKED','STANDARD_VERIFIED'].includes(r.verification));function toggle(which){mode=which;$('selectMode').classList.toggle('hidden',which!=='select');$('textMode').classList.toggle('hidden',which!=='text');$('tabSelect').classList.toggle('active',which==='select');$('tabText').classList.toggle('active',which==='text')} $('catalogStatus').textContent=`登録条件：${validRecords.length}件 ／ 正式規格との照合済み：${validRecords.filter(r=>r.verification==='STANDARD_VERIFIED').length}件 ／ 未検証：${validRecords.filter(r=>r.verification==='UNVERIFIED').length}件。選択肢は収録予定の条件を含み、未登録でも規格が存在しない意味ではありません。`; $('recordList').textContent=validRecords.length?validRecords.map(r=>`${r.std} ${r.pressure} ${r.size} ${r.facing} / ${r.flange} / ${window.FIELD_FLANGE_DATA.statusDefinitions[r.verification]||r.verification}`).join(' ／ '):'有効な登録データはありません'; $('tabSelect').onclick=()=>toggle('select');$('tabText').onclick=()=>toggle('text');$('std').onchange=()=>{$('pressure').innerHTML=($('std').value==='JPI'?['300LB','150LB','600LB']:['10K','5K','20K']).map(x=>`<option>${x}</option>`).join('')};function item(k,v){return `<div class="item"><small>${k}</small><strong>${v==null?'未登録':v}</strong></div>`}function mm(v){return v==null?'未登録':v+' mm'}function search(){let matches=[];if(mode==='select'){matches=validRecords.filter(r=>r.std===$('std').value&&r.pressure===$('pressure').value&&r.size===$('size').value&&r.facing===$('facing').value&&r.flange===$('flange').value)}else{const q=$('query').value.toUpperCase().normalize('NFKC').replace(/[（）()]/g,' ').replace(/\s+/g,' ').trim();if(q){matches=validRecords.filter(r=>{const a=Number.parseInt(r.size,10);const b=({50:2,80:3,100:4,150:6,200:8})[a];const stds=['JPI','JIS'];const ps=['300LB','150LB','600LB','5K','10K','20K'];const faces=['RF','FF','RTJ'];const types=['WN','SO','BL','SW','TH','LJ'];const sizeMatch=new RegExp('(?:^|[^0-9])'+a+'\\s*A(?:$|[^A-Z0-9])').test(q)||(b&&new RegExp('(?:^|[^0-9])'+b+'\\s*(?:B|インチ|INCH)(?:$|[^A-Z0-9])').test(q));const mentioned=(opts)=>opts.filter(x=>new RegExp('(?:^|[^A-Z0-9])'+x+'(?:$|[^A-Z0-9])').test(q));return sizeMatch&&mentioned(stds).includes(r.std)&&mentioned(ps).includes(r.pressure)&&(!mentioned(faces).length||mentioned(faces).includes(r.facing))&&(!mentioned(types).length||mentioned(types).includes(r.flange))})}}const ok=matches.length>0;data=ok?matches[0]:null;if(!ok){$('results').innerHTML='<div class="card"><h2>該当する登録データがありません</h2><p class="muted">現在の条件に対応する登録済み寸法はありません。未登録は規格上の不存在を意味しません。未確認の組合せを推測で表示しません。</p></div>';return}$('results').innerHTML=`<div class="warn"><b>⚠️ 公開資料由来の調査候補値（正式規格未照合）</b><br>正式規格本文との照合・形式別適合確認は未完了です。現場での製作・発注・強度判断には使用しないでください。</div><div class="card"><span class="pill">${data.std} ${data.pressure} ${data.size}（${data.nominalSizeB||"B表記未確認"}） ${data.facing}</span><h2 style="margin-top:12px">フランジ寸法</h2><p class="muted">形式：${data.flange}（WN/SO/BL等への適用未確定）</p><div class="grid">${item('外径',mm(data.d))}${item('厚さ（参考）',mm(data.t))}${item('PCD',mm(data.pcd))}${item('ボルト穴径',mm(data.holeD))}${item('穴数',data.holes+' 穴')}${item('RF座面径',mm(data.faceD))}</div></div><div class="card"><h2>ボルト・ナット</h2><label>ボルト形式（数量モデル）</label><select id="boltType"><option value="stud">スタッドボルト</option><option value="hex">六角ボルト</option></select><div class="grid" style="margin-top:12px">${item('ねじ候補（メートル）',data.threadMetric)}${item('ねじ候補（インチ）',data.threadInch)}${item('ボルト本数',data.holes+' 本')}<div class="item"><small>ナット数（基本構成）</small><strong id="nutCount">${data.holes*2} 個</strong></div>${item('スパナサイズ',data.nutAcrossFlats==null?'未確認':data.nutAcrossFlats+' mm')}${item('ボルト長さ（確定）',data.boltLength==null?'未確認':mm(data.boltLength))}${data.studBoltLengthReference!=null?item('スタッド長（参考条件付き）',mm(data.studBoltLengthReference)):''}${data.hexBoltLengthReference!=null?item('六角ボルト長（参考条件付き）',mm(data.hexBoltLengthReference)):''}</div><p class="muted">ねじ候補は異なるねじ系の参考値であり、相互互換ではありません。実際の締結仕様・ナット規格を確認してください。${data.boltLengthAssumptions?"<br>参考長さの前提："+data.boltLengthAssumptions:""}</p></div><div class="card"><h2>うず巻形ガスケット（内外輪付）</h2><p class="muted">${data.gasket?"JPI-7S-41-2018対応の公開メーカー資料に基づく候補。適合未確認。":"この呼び径のガスケット寸法は未登録。"}</p><div class="grid">${item('内輪内径 D1',mm(data.gasket?.[0]))}${item('本体内径 D2',mm(data.gasket?.[1]))}${item('本体外径 D3',mm(data.gasket?.[2]))}${item('外輪外径 D4',mm(data.gasket?.[3]))}</div></div><div class="card"><h2>出典・確認状況</h2><p class="muted">フランジ：${data.sourceEdition||"公開資料"}<br><a href="${data.flangeSource}">フランジ寸法の参照元</a><br>ねじ候補：<a href="https://www.daiko-jp.com/media/useful/a353">ダイコー公開資料</a><br>ガスケット：${data.gasketSource?`<a href="${data.gasketSource}">公開資料</a>`:"未登録"}<br>検証状態：${window.FIELD_FLANGE_DATA.statusDefinitions[data.verification]||data.verification} ／ 形式別適合：${data.flangeTypeApplicability} ／ ガスケット適合：${data.gasketCompatibility} ／ 正式規格本文未照合</p></div>`;$('boltType').onchange=e=>$('nutCount').textContent=(data.holes*(e.target.value==='stud'?2:1))+' 個'}$('search').onclick=()=>{search();$('results').scrollIntoView({behavior:'smooth',block:'start'})};search();</script><script>
(function(){const s=document.getElementById('offlineStatus');if(!('serviceWorker' in navigator)){s.textContent='この環境ではオフライン保存機能を利用できません';return}if(location.protocol==='file:'){s.textContent='単体HTMLは閲覧可能。完全オフラインPWAの登録にはHTTPS公開が必要です';return}navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{s.textContent='オフライン保存の準備が完了しました（初回はオンラインで全ファイル取得が必要）'}).catch(()=>{s.textContent='オフライン保存を設定できませんでした'});})();
</script></body></html>
